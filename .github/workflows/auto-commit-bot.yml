name: Daily Contribution Bot

on:
  schedule:
    - cron: '55 9 * * 1,2,3,4,5'
    - cron: '27 10 * * 1,2,3,4,5'
    - cron: '33 11 * * 1,2,3,4,5'
    - cron: '56 12 * * 1,2,3,4,5'
    - cron: '4 14 * * 1,2,3,4,5'
    - cron: '47 15 * * 1,2,3,4,5'
    - cron: '50 16 * * 1,2,3,4,5'
    - cron: '21 17 * * 1,2,3,4,5'
  workflow_dispatch: # Allows manual trigger from dashboard

permissions:
  contents: write

jobs:
  make-contributions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          
      - name: Verify Active Subscription
        id: check_sub
        run: |
          echo "Verifying subscription status for unique login ID..."
          # Query Supabase secure configurations via anon key
          API_URL="https://fcshvgrxbyrwhnzxyrqj.supabase.co/rest/v1/user_configs?username=eq.rahul&select=plan,expires_at"
          ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZjc2h2Z3J4Ynlyd2huenh5cnFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMjkzOTQsImV4cCI6MjEwMTYwNTM5NH0.7HbxE9gQS2MlUoFLW5VwEcnfW_9Ua1BwXm9ThhmveXc"
          
          RESPONSE=$(curl -s -H "apikey: $ANON_KEY" -H "Authorization: Bearer $ANON_KEY" "$API_URL")
          
          if [ "$RESPONSE" = "[]" ] || [ -z "$RESPONSE" ]; then
            echo "[-] Subscription validation failed: User account config not found. Skipping commits."
            echo "proceed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          PLAN=$(echo "$RESPONSE" | grep -o '"plan":"[^"]*' | cut -d'"' -f4)
          EXPIRES_AT=$(echo "$RESPONSE" | grep -o '"expires_at":"[^"]*' | cut -d'"' -f4)
          
          if [ "$PLAN" = "paused" ]; then
            echo "[-] Subscription is paused by administrator. Skipping commits."
            echo "proceed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Expiration checks are disabled. All accounts have lifetime access.
          
          echo "[+] Subscription active (Plan: $PLAN). Proceeding with auto-pushes..."
          echo "proceed=true" >> $GITHUB_OUTPUT

      - name: Make Random Changes
        if: steps.check_sub.outputs.proceed == 'true'
        run: |
          # Seed random generator and choose between custom min/max range
          NUM_COMMITS=$((1 + RANDOM % (5 - 1 + 1)))
          echo "Bot decided to create $NUM_COMMITS commits for this interval."
          
          # Ensure git is configured
          git config --global user.name "Rahul"
          git config --global user.email "200019162+rahulbisht-dev@users.noreply.github.com"
          
          # Available file formats
          FORMATS=(js py md)
          
          # List of commit messages
          MESSAGES=("refactor: optimize DB query operations" "docs: update API endpoints documentation" "style: clean up responsive layout styles" "feat: add multi-threading support to worker" "fix: resolve race conditions on file lock")
          MSG_LEN=${#MESSAGES[@]}
          
          # Select random file format for updates
          RAND_FMT=${FORMATS[$RANDOM % ${#FORMATS[@]}]}
          FILENAME="update_activity_$((RANDOM % 1000)).$RAND_FMT"
          
          # Seed initial content depending on language format
          if [ "$RAND_FMT" = "js" ]; then
            echo -e "const contribute = () => {
  console.log('GitHub Automator run: ' + new Date());
};
contribute();" > $FILENAME
          elif [ "$RAND_FMT" = "py" ]; then
            echo -e "def contribute():
    print('GitHub Automator run:', '$(date)')

if __name__ == '__main__':
    contribute()" > $FILENAME
          elif [ "$RAND_FMT" = "json" ]; then
            echo "{"timestamp": "$(date)", "automation": "active", "build": $RANDOM}" > $FILENAME
          elif [ "$RAND_FMT" = "txt" ]; then
            echo "Automated session log contribution at $(date)" > $FILENAME
          else
            # Default to markdown
            echo -e "### GitHub Activity Update\n\n- Generated at: $(date)\n- Status: active\n- Runs: $NUM_COMMITS" > $FILENAME
          fi
          
          # Loop to commit changes
          for i in $(seq 1 $NUM_COMMITS); do
            RAND_IDX=$(($RANDOM % $MSG_LEN))
            COMMIT_MSG="${MESSAGES[$RAND_IDX]} [skip ci]"
            
            # Append uniqueness token to trigger unique commit hashes
            echo "// Contribution update chunk #$i at $(date)" >> $FILENAME
            git add $FILENAME
            git commit -m "$COMMIT_MSG"
          done
          
          # Push all commits to the remote branch
          git push

      - name: Boost Profile Views (+180 views per run)
        if: steps.check_sub.outputs.proceed == 'true'
        run: |
          echo "Sending 180 pings to profile views counter for rahulbisht-dev..."
          for i in {1..180}; do
            curl -s "https://komarev.com/ghpvc/?username=rahulbisht-dev" > /dev/null
            curl -s "https://api.visitorbadge.io/api/visitors?path=rahulbisht-dev&style=flat&countColor=%238b5cf6" > /dev/null
            sleep 0.05
          done
